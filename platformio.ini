; ============================================================
; PoultryPortal — Clean PlatformIO Configuration
; ============================================================

[env:esp32dev]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_protocol = esptool
upload_port = COM3
monitor_port = COM3

lib_ldf_mode = deep+

; ------------------------------------------------------------
; Build Flags
; ------------------------------------------------------------
; - Use C++14
; - Add include paths for all module folders
; ------------------------------------------------------------
build_flags =
    -std=gnu++14
    -Isrc
    -Isrc/modules
    -Isrc/modules/system
    -Isrc/modules/config
    -Isrc/modules/scheduler
    -Isrc/modules/motor
    -Isrc/modules/hardware
    -Isrc/modules/sensors
    -Isrc/modules/energy
    -Isrc/modules/battery
    -Isrc/modules/display
    -Isrc/modules/utils
    -Isrc/modules/telegram

; ------------------------------------------------------------
; Library Dependencies
; ------------------------------------------------------------
; Removed:
;   - AsyncTCP
;   - ESPAsyncWebServer
;   - WebSerial
; because your new architecture no longer uses them.
; ------------------------------------------------------------
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit INA219
    bblanchon/ArduinoJson @ ^6.21.3
    SunSet
    tzapu/WiFiManager