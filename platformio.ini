; ============================================================
; PoultryPortal — Clean PlatformIO Configuration
; ============================================================

[env:esp32dev]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_port = COM3
monitor_port = COM3

lib_ldf_mode = deep+

build_flags =
    -std=gnu++14
    -Isrc
    -Isrc/modules
    -Isrc/modules/system
    -Isrc/modules/config
    -Isrc/modules/scheduler
    -Isrc/modules/motor
    -Isrc/modules/hardware
    -Isrc/modules/sensors
    -Isrc/modules/energy
    -Isrc/modules/battery
    -Isrc/modules/display
    -Isrc/modules/utils
    -Isrc/modules/telegram
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit INA219
    bblanchon/ArduinoJson @ ^6.21.3
    SunSet
    tzapu/WiFiManager @ ^2.0.16-rc.2


